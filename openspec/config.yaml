schema: spec-driven

context: |
  File `docs/constitution.md` is the project's constitution.
  The constitution defines the principles and guidelines that govern the project.
  This includes coding standards, architectural decisions, tech stack choices, and test strategies.
  Proceed ONLY AFTER reading it.

  All principles stated in the constitution are NON-NEGOTIABLE and MUST be followed.

  Apply the "Writing Style" rules from the agent instructions file (`CLAUDE.md`, `AGENTS.md`, or equivalent) to every artifact.
  Run `npx prettier --write openspec/` after creating or updating any artifact to ensure consistent formatting.

rules:
  proposal:
    - When on the `main` branch, create a git branch for each proposal using the name of the proposal without prefixes and suffixes
    - If applicable, include an issue number, title, and description at the beginning
    - Include a "## Constitution Compliance" section that lists the principles that apply and any violations
  design:
    - Include a "## Constitution Compliance" section that lists the principles that apply and any violations
  specs:
    - Make sure the spec does not include technical details
  tasks:
    - Use test-driven development - write tests first, then implement and refactor
    - Omit end-to-end manual verification tasks if backend tests can fully verify the change
    - Include a "## Constitution Compliance" section that lists the principles that apply and any violations

operations:
  apply:
    guidance:
      - Apply the code style rules in `docs/code-style.md`
      - Use the `testing` skill for each new or modified test
      - To check the application, assume that the backend and frontend are already up and running
