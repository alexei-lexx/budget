version: "3.8"

services:
  dynamodb-local:
    image: "amazon/dynamodb-local:3.3.0"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    ports:
      - "8000:8000"
    volumes:
      - "./docker/dynamodb:/home/dynamodblocal/data"
    working_dir: /home/dynamodblocal

  # DynamoDB Admin UI (alternative implementation)
  dynamodb-admin:
    image: "aaronshaf/dynamodb-admin:latest"
    ports:
      - "8001:8001"
    environment:
      - DYNAMO_ENDPOINT=http://dynamodb-local:8000
    depends_on:
      - dynamodb-local

  phoenix:
    image: "arizephoenix/phoenix:version-21.0.0"
    ports:
      - "127.0.0.1:6006:6006"
    environment:
      # Phoenix enables login for non-loopback hosts, such as 0.0.0.0 in Docker.
      # Login off is safe because the port is open only on this machine.
      - PHOENIX_ENABLE_AUTH=false
      - PHOENIX_WORKING_DIR=/mnt/data
    volumes:
      - "./docker/phoenix:/mnt/data"
